<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>الأرشيف</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --card: #ffffff;
      --primary: #1d4ed8;
      --secondary: #0f172a;
      --muted: #64748b;
      --border: rgba(15, 23, 42, 0.08);
      --success: #166534;
      --warning: #9a5b00;
      --danger: #b91c1c;
      --shadow: 0 18px 45px rgba(15, 23, 42, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      font-family: Tahoma, Arial, sans-serif;
      background: linear-gradient(180deg, #edf4ff 0%, #f8fafc 100%);
      color: var(--secondary);
    }

    .page.app-page {
      max-width: 1600px;
      margin: 0 auto;
      padding: 20px 14px 24px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .header h1 {
      margin: 0;
      font-size: 2rem;
    }

    .header p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .top-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      appearance: none;
      border: none;
      border-radius: 12px;
      padding: 11px 16px;
      background: var(--primary);
      color: white;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .btn:hover { transform: translateY(-1px); }

    .btn.secondary {
      background: #e2e8f0;
      color: var(--secondary);
    }

    .status-box {
      display: none;
      margin-bottom: 18px;
      border-radius: 12px;
      padding: 12px 14px;
      font-weight: 700;
    }

    .status-box.show { display: block; }
    .status-box.success { background: #dcfce7; color: var(--success); }
    .status-box.error { background: #fee2e2; color: var(--danger); }

    .filters {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      background: rgba(255,255,255,0.7);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 12px 14px;
      box-shadow: var(--shadow);
      margin-bottom: 18px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 180px;
    }

    .field label {
      font-size: 0.83rem;
      color: var(--muted);
      font-weight: 700;
    }

    .field select,
    .field input {
      border: 1px solid #dbe3ef;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.95rem;
      background: white;
      min-height: 42px;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 18px;
    }

    .archive-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
    }

    .thumb {
      position: relative;
      width: 100%;
      height: 220px;
      background: linear-gradient(135deg, #e2e8f0, #f8fafc);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .thumb .placeholder {
      font-size: 3rem;
      color: var(--muted);
    }

    .card-body {
      padding: 14px 14px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .file-name {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--secondary);
      line-height: 1.5;
      word-break: break-word;
    }

    .meta-list {
      display: grid;
      gap: 6px;
      font-size: 0.88rem;
      color: var(--muted);
    }

    .meta-item {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
    }

    .meta-item strong {
      color: var(--secondary);
      font-weight: 700;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 78px;
      border-radius: 999px;
      padding: 4px 8px;
      background: #dbeafe;
      color: #1d4ed8;
      font-size: 0.76rem;
      font-weight: 700;
    }

    .download-link {
      display: inline-block;
      width: 100%;
      text-align: center;
      text-decoration: none;
      background: #eff6ff;
      color: var(--primary);
      border: 1px solid #bfdbfe;
      border-radius: 12px;
      padding: 10px 12px;
      font-weight: 700;
      margin-top: 4px;
    }

    .empty-state {
      text-align: center;
      padding: 36px 20px;
      border: 1px dashed #cad5e2;
      border-radius: 16px;
      background: rgba(255,255,255,0.65);
      color: var(--muted);
      font-weight: 700;
    }

    @media (max-width: 700px) {
      .page.app-page { padding: 16px 12px 20px; }
      .cards-grid { grid-template-columns: 1fr; }
    }
  </style>
  <link rel="stylesheet" href="/layout-defaults.css" />
</head>
<body class="app-shell">
  <div class="page app-page">
    <div class="header">
      <div>
        <h1>الأرشيف</h1>
        <p>ملفات الإدارة المصنفة مع معاينة سريعة وتحميل مباشر.</p>
      </div>
      <div class="top-actions">
        <button class="btn secondary" type="button" id="backBtn">العودة إلى الرئيسية</button>
      </div>
    </div>

    <div class="status-box" id="archiveStatus"></div>

    <div class="filters">
      <div class="field">
        <label for="categoryFilter">التصنيف</label>
        <select id="categoryFilter">
          <option value="all">الكل</option>
          <option value="general">تعاميم</option>
          <option value="reports">كشوف</option>
        </select>
      </div>
      <div class="field">
        <label for="searchInput">بحث</label>
        <input id="searchInput" type="text" placeholder="اسم الملف أو النوع" />
      </div>
    </div>

    <div class="cards-grid" id="archiveGrid"></div>
  </div>

  <script>
    const authToken = localStorage.getItem('authToken');
    if (!authToken) {
      window.location.href = '/';
    }

    const categoryFilter = document.getElementById('categoryFilter');
    const searchInput = document.getElementById('searchInput');
    const archiveGrid = document.getElementById('archiveGrid');
    const archiveStatus = document.getElementById('archiveStatus');
    const backBtn = document.getElementById('backBtn');

    let records = [];

    function setStatus(message, type = 'success') {
      archiveStatus.textContent = message || '';
      archiveStatus.className = 'status-box';
      if (!message) return;
      archiveStatus.classList.add('show');
      archiveStatus.classList.add(type === 'error' ? 'error' : 'success');
    }

    function isImage(ext) {
      return ['jpg', 'jpeg', 'png', 'gif', 'bmp', 'webp'].includes(String(ext || '').toLowerCase());
    }

    function fileDisplayType(type, ext) {
      if (type === 'image') return 'صورة';
      if (type === 'pdf') return 'PDF';
      if (type === 'document') return 'مستند';
      if (type === 'sheet') return 'جدول';
      return 'ملف';
    }

    function getCategoryLabel(category) {
      return category === 'reports' ? 'كشوف' : 'تعاميم';
    }

    function thumbnailMarkup(item) {
      const ext = String(item.Extension || '').toLowerCase();
      const url = item.DownloadUrl || '#';

      if (isImage(ext)) {
        return `<img src="${url}" alt="${item.FileName || 'ملف'}" />`;
      }

      return `<div class="placeholder">📄</div>`;
    }

    function renderArchive(recordsList) {
      archiveGrid.innerHTML = '';
      if (!recordsList.length) {
        archiveGrid.innerHTML = '<div class="empty-state">لا توجد ملفات في هذا التصنيف حالياً.</div>';
        return;
      }

      recordsList.forEach((item) => {
        const card = document.createElement('article');
        card.className = 'archive-card';
        const pageText = Number(item.PageCount || 0) > 0 ? `${item.PageCount} صفحة` : '1 عنصر';
        const categoryLabel = getCategoryLabel(item.Category);
        const fileTypeText = fileDisplayType(item.FileType, item.Extension);
        const downloadUrl = item.DownloadUrl || '#';
        const previewImageUrl = item.ThumbnailUrl || downloadUrl;

        card.innerHTML = `
          <div class="thumb"><img src="${previewImageUrl}" alt="${item.FileName || 'ملف'}" onerror="this.style.display='none'; this.parentElement.innerHTML='<div class=\'placeholder\'>📄</div>'" /></div>
          <div class="card-body">
            <h3 class="file-name">${item.FileName || 'ملف بدون اسم'}</h3>
            <div class="meta-list">
              <div class="meta-item"><span>نوع الملف</span><strong>${fileTypeText}</strong></div>
              <div class="meta-item"><span>عدد الصفحات</span><strong>${pageText}</strong></div>
              <div class="meta-item"><span>تاريخ الرفع</span><strong>${item.UploadedAt || ''}</strong></div>
              <div class="meta-item"><span>التصنيف</span><span class="tag">${categoryLabel}</span></div>
              <div class="meta-item"><span>الامتداد</span><strong>.${String(item.Extension || '').toLowerCase() || 'file'}</strong></div>
            </div>
            <a class="download-link" href="${downloadUrl}" target="_blank" rel="noreferrer">تحميل الملف</a>
          </div>
        `;

        archiveGrid.appendChild(card);
      });
    }

    async function requestJson(url, options = {}) {
      const response = await fetch(url, {
        ...options,
        headers: {
          'Content-Type': 'application/json',
          Authorization: `Bearer ${authToken}`,
          ...(options.headers || {})
        }
      });

      if (response.status === 401 || response.status === 403) {
        localStorage.removeItem('authToken');
        window.location.href = '/';
        return null;
      }

      return response;
    }

    async function loadArchive() {
      const response = await requestJson('/api/archive');
      if (!response) return;
      if (!response.ok) {
        const payload = await response.json().catch(() => ({}));
        setStatus(payload.message || 'تعذر تحميل أرشيف الملفات.', 'error');
        return;
      }

      records = await response.json();
      applyFilters();
    }

    function applyFilters() {
      const categoryValue = categoryFilter.value;
      const term = searchInput.value.trim().toLowerCase();

      const filtered = records.filter((item) => {
        const categoryMatches = categoryValue === 'all' || String(item.Category || '') === categoryValue;
        const searchMatches = !term || [
          item.FileName,
          item.FileType,
          item.Extension,
          item.Category,
          getCategoryLabel(item.Category)
        ].some((value) => String(value || '').toLowerCase().includes(term));

        return categoryMatches && searchMatches;
      });

      renderArchive(filtered);
    }

    categoryFilter.addEventListener('change', applyFilters);
    searchInput.addEventListener('input', applyFilters);
    backBtn.addEventListener('click', () => {
      window.location.href = '/dashboard.html';
    });

    loadArchive();
  </script>
</body>
</html>
