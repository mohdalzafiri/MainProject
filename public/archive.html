<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>الأرشيف</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --card: #ffffff;
      --primary: #1d4ed8;
      --secondary: #0f172a;
      --muted: #64748b;
      --border: rgba(15, 23, 42, 0.08);
      --success: #166534;
      --warning: #9a5b00;
      --danger: #b91c1c;
      --shadow: 0 18px 45px rgba(15, 23, 42, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      font-family: Tahoma, Arial, sans-serif;
      background: linear-gradient(180deg, #edf4ff 0%, #f8fafc 100%);
      color: var(--secondary);
    }

    .page.app-page {
      max-width: 1600px;
      margin: 0 auto;
      padding: 20px 14px 24px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .header h1 {
      margin: 0;
      font-size: 2rem;
    }

    .header p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .top-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      appearance: none;
      border: none;
      border-radius: 12px;
      padding: 11px 16px;
      background: var(--primary);
      color: white;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .btn:hover { transform: translateY(-1px); }

    .btn.secondary {
      background: #e2e8f0;
      color: var(--secondary);
    }

    .status-box {
      display: none;
      margin-bottom: 18px;
      border-radius: 12px;
      padding: 12px 14px;
      font-weight: 700;
    }

    .status-box.show { display: block; }
    .status-box.success { background: #dcfce7; color: var(--success); }
    .status-box.error { background: #fee2e2; color: var(--danger); }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 18px;
    }

    .folder-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: var(--shadow);
      padding: 22px;
      display: grid;
      grid-template-columns: 54px 1fr auto;
      align-items: center;
      gap: 14px;
      color: inherit;
      text-decoration: none;
      transition: transform .18s ease, border-color .18s ease;
    }

    .folder-card:hover {
      transform: translateY(-2px);
      border-color: #93c5fd;
    }

    .folder-icon {
      width: 54px;
      height: 46px;
      display: grid;
      place-items: center;
      color: #b45309;
    }

    .folder-icon svg { width: 46px; height: 46px; }

    .folder-name {
      margin: 0 0 5px;
      font-size: 1.1rem;
      color: var(--secondary);
      font-weight: 700;
    }

    .folder-meta { margin: 0; color: var(--muted); font-size: .9rem; }
    .folder-arrow { color: var(--primary); font-size: 1.5rem; }

    .empty-state {
      text-align: center;
      padding: 36px 20px;
      border: 1px dashed #cad5e2;
      border-radius: 16px;
      background: rgba(255,255,255,0.65);
      color: var(--muted);
      font-weight: 700;
    }

    @media (max-width: 700px) {
      .page.app-page { padding: 16px 12px 20px; }
      .cards-grid { grid-template-columns: 1fr; }
    }
  </style>
  <link rel="stylesheet" href="/layout-defaults.css" />
</head>
<body class="app-shell">
  <div class="page app-page">
    <div class="header">
      <div>
        <h1>الأرشيف</h1>
        <p>اختر المجلد لعرض الملفات الرسمية المحفوظة داخله.</p>
      </div>
      <div class="top-actions">
        <button class="btn secondary" type="button" id="backBtn">العودة إلى الرئيسية</button>
      </div>
    </div>

    <div class="status-box" id="archiveStatus"></div>

    <div class="cards-grid" id="archiveGrid"></div>
  </div>

  <script>
    const authToken = localStorage.getItem('authToken');
    if (!authToken) {
      window.location.href = '/';
    }

    const archiveGrid = document.getElementById('archiveGrid');
    const archiveStatus = document.getElementById('archiveStatus');
    const backBtn = document.getElementById('backBtn');

    function setStatus(message, type = 'success') {
      archiveStatus.textContent = message || '';
      archiveStatus.className = 'status-box';
      if (!message) return;
      archiveStatus.classList.add('show');
      archiveStatus.classList.add(type === 'error' ? 'error' : 'success');
    }

    function renderFolders(categories) {
      archiveGrid.innerHTML = '';
      if (!categories.length) {
        archiveGrid.innerHTML = '<div class="empty-state">لا توجد مجلدات أرشيف مفعلة.</div>';
        return;
      }

      categories.forEach((item) => {
        const card = document.createElement('a');
        card.className = 'folder-card';
        card.href = item.Url || `/archive-folder.html?category=${encodeURIComponent(item.KeyName)}`;

        card.innerHTML = `
          <span class="folder-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7.5a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M3 10h18"/></svg></span>
          <div>
            <h2 class="folder-name">${item.LabelAr}</h2>
            <p class="folder-meta">${Number(item.FileCount || 0)} ملف · ${item.KeyName}</p>
          </div>
          <span class="folder-arrow" aria-hidden="true">‹</span>
        `;

        archiveGrid.appendChild(card);
      });
    }

    async function requestJson(url, options = {}) {
      const response = await fetch(url, {
        ...options,
        headers: {
          'Content-Type': 'application/json',
          Authorization: `Bearer ${authToken}`,
          ...(options.headers || {})
        }
      });

      if (response.status === 401 || response.status === 403) {
        localStorage.removeItem('authToken');
        window.location.href = '/';
        return null;
      }

      return response;
    }

    async function loadFolders() {
      const response = await requestJson('/api/archive/categories');
      if (!response) return;
      if (!response.ok) {
        const payload = await response.json().catch(() => ({}));
        setStatus(payload.message || 'تعذر تحميل مجلدات الأرشيف.', 'error');
        return;
      }

      renderFolders(await response.json());
    }

    backBtn.addEventListener('click', () => {
      window.location.href = '/dashboard.html';
    });

    loadFolders();
  </script>
</body>
</html>
