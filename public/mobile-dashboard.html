<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>الرئيسية - إدارة البلاغات</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="stylesheet" href="/layout-defaults.css" />
  <meta name="theme-color" content="#f6faff" />
  <meta name="apple-mobile-web-app-title" content="إدارة البلاغات" />
  <link rel="apple-touch-icon" href="/images/logo.png" />
  <style>
    :root {
      --mobile-bg: #f6faff;
      --mobile-surface: rgba(255, 255, 255, .9);
      --mobile-surface-solid: #fff;
      --mobile-text: #0b2447;
      --mobile-muted: #64748b;
      --mobile-primary: #0875cf;
      --mobile-primary-dark: #055ba5;
      --mobile-border: rgba(8, 117, 207, .09);
      --mobile-shadow: 0 9px 25px rgba(30, 93, 151, .12);
      --mobile-icon-bg: linear-gradient(145deg, #f8fbff, #e4f1fd);
      --mobile-danger: #dc2626;
    }

    * { box-sizing: border-box; }

    body.app-shell {
      color: var(--mobile-text);
      background:
        radial-gradient(ellipse at 5% 10%, rgba(147, 197, 253, .24), transparent 32%),
        radial-gradient(ellipse at 95% 26%, rgba(191, 219, 254, .28), transparent 32%),
        linear-gradient(180deg, #fbfdff 0%, var(--mobile-bg) 58%, #edf6ff 100%);
      transition: color .2s ease, background .2s ease;
    }

    body.app-shell.dark-mode {
      --mobile-bg: #071525;
      --mobile-surface: rgba(15, 35, 58, .94);
      --mobile-surface-solid: #10243c;
      --mobile-text: #eff6ff;
      --mobile-muted: #a9bed6;
      --mobile-primary: #4db6ff;
      --mobile-primary-dark: #2399eb;
      --mobile-border: rgba(147, 197, 253, .13);
      --mobile-shadow: 0 10px 26px rgba(0, 0, 0, .3);
      --mobile-icon-bg: linear-gradient(145deg, #173754, #0d2842);
      background:
        radial-gradient(ellipse at 5% 10%, rgba(14, 116, 184, .22), transparent 32%),
        radial-gradient(ellipse at 95% 26%, rgba(29, 78, 216, .16), transparent 34%),
        linear-gradient(180deg, #07111f 0%, var(--mobile-bg) 100%);
    }

    body.app-shell > .mobile-page {
      width: min(var(--app-page-max-width), calc(100vw - var(--app-page-side-gap)));
      min-height: 100vh;
      margin: 0;
      padding: 14px 14px calc(104px + env(safe-area-inset-bottom));
      gap: 16px;
      position: relative;
      overflow: hidden;
    }

    .mobile-page::before,
    .mobile-page::after {
      content: "";
      position: absolute;
      z-index: -1;
      width: 420px;
      height: 170px;
      border: 24px solid rgba(147, 197, 253, .13);
      border-radius: 50%;
      transform: rotate(-24deg);
      pointer-events: none;
    }

    .mobile-page::before { top: 70px; left: -250px; }
    .mobile-page::after { top: 190px; right: -270px; }

    .menu-button {
      position: absolute;
      z-index: 3;
      top: calc(18px + env(safe-area-inset-top));
      right: 18px;
      width: 46px;
      height: 46px;
      padding: 9px;
      border: 0;
      border-radius: 14px;
      color: var(--mobile-primary);
      background: rgba(255, 255, 255, .72);
      box-shadow: 0 5px 18px rgba(37, 99, 235, .08);
      cursor: pointer;
      backdrop-filter: blur(12px);
    }

    .dark-mode .menu-button { background: rgba(15, 35, 58, .82); }
    .menu-button svg { width: 100%; height: 100%; }

    .hero {
      min-height: 310px;
      display: grid;
      place-items: center;
      padding: calc(22px + env(safe-area-inset-top)) 10px 4px;
      text-align: center;
    }

    .hero img {
      width: min(250px, 68vw);
      max-height: 280px;
      object-fit: contain;
      filter: drop-shadow(0 13px 18px rgba(18, 93, 153, .12));
    }

    .services {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .service-card {
      min-width: 0;
      min-height: 137px;
      padding: 14px 7px 12px;
      display: grid;
      grid-template-rows: 68px auto;
      align-items: center;
      justify-items: center;
      gap: 8px;
      border: 1px solid var(--mobile-border);
      border-radius: 20px;
      color: var(--mobile-text);
      background: var(--mobile-surface);
      text-decoration: none;
      box-shadow: var(--mobile-shadow);
      backdrop-filter: blur(12px);
      transition: transform .16s ease, box-shadow .16s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .service-card:active { transform: scale(.97); }
    .service-card[hidden] { display: none; }

    .service-icon {
      width: 68px;
      height: 68px;
      display: grid;
      place-items: center;
      border-radius: 20px;
      color: var(--mobile-primary);
      background: var(--mobile-icon-bg);
    }

    .service-icon svg {
      width: 42px;
      height: 42px;
      stroke: currentColor;
    }

    .service-card strong {
      max-width: 100%;
      font-size: clamp(13px, 3.6vw, 16px);
      line-height: 1.35;
      text-align: center;
      overflow-wrap: anywhere;
    }

    .bottom-nav {
      position: fixed;
      z-index: 12;
      right: max(calc(var(--app-page-side-gap) / 2), calc((100vw - var(--app-page-max-width)) / 2));
      bottom: 0;
      width: min(var(--app-page-max-width), calc(100vw - var(--app-page-side-gap)));
      min-height: calc(80px + env(safe-area-inset-bottom));
      padding: 9px 16px calc(7px + env(safe-area-inset-bottom));
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
      border: 1px solid var(--mobile-border);
      border-bottom: 0;
      border-radius: 28px 28px 0 0;
      background: var(--mobile-surface);
      box-shadow: 0 -9px 28px rgba(15, 64, 109, .1);
      backdrop-filter: blur(18px);
    }

    .nav-item {
      min-width: 0;
      padding: 2px 3px;
      display: grid;
      justify-items: center;
      align-content: center;
      gap: 2px;
      border: 0;
      color: #7b8797;
      background: transparent;
      text-decoration: none;
      font: inherit;
      cursor: pointer;
    }

    .nav-item svg { width: 29px; height: 29px; stroke: currentColor; }
    .nav-item span { font-size: 12px; font-weight: 700; white-space: nowrap; }
    .nav-item.active { color: var(--mobile-primary); }
    .nav-item.active::after {
      content: "";
      width: 44px;
      height: 3px;
      border-radius: 999px;
      background: currentColor;
    }
    .nav-item[hidden] { display: none; }

    .drawer-overlay {
      position: fixed;
      z-index: 20;
      inset: 0;
      opacity: 0;
      visibility: hidden;
      background: rgba(2, 15, 30, .38);
      transition: opacity .2s ease, visibility .2s ease;
    }

    .drawer-overlay.open { opacity: 1; visibility: visible; }

    .drawer {
      position: absolute;
      top: 0;
      right: max(calc(var(--app-page-side-gap) / 2), calc((100vw - var(--app-page-max-width)) / 2));
      width: min(84vw, 360px);
      height: 100%;
      padding: calc(34px + env(safe-area-inset-top)) 20px 24px;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 28px;
      color: var(--mobile-text);
      background: var(--mobile-surface-solid);
      box-shadow: -18px 0 45px rgba(2, 15, 30, .2);
      transform: translateX(105%);
      transition: transform .24s ease;
    }

    .drawer-overlay.open .drawer { transform: translateX(0); }

    .drawer-profile {
      display: grid;
      grid-template-columns: 72px minmax(0, 1fr);
      align-items: center;
      gap: 14px;
    }

    .profile-avatar {
      width: 72px;
      height: 72px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: #55b9ff;
      background: #17364f;
    }

    .profile-avatar img { width: 100%; height: 100%; border-radius: inherit; object-fit: cover; }
    .profile-details { min-width: 0; display: grid; gap: 4px; }
    .profile-details strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 17px; }
    .profile-details span { color: var(--mobile-muted); font-size: 12px; }

    .drawer-menu {
      display: grid;
      align-content: start;
      gap: 8px;
    }

    .drawer-item {
      width: 100%;
      min-height: 54px;
      padding: 11px 10px;
      display: grid;
      grid-template-columns: 28px 1fr auto;
      align-items: center;
      gap: 11px;
      border: 0;
      border-bottom: 1px solid var(--mobile-border);
      color: var(--mobile-text);
      background: transparent;
      text-decoration: none;
      font: inherit;
      font-weight: 700;
      text-align: right;
      cursor: pointer;
    }

    .drawer-item svg { width: 24px; height: 24px; stroke: currentColor; }
    .drawer-item.danger { color: var(--mobile-danger); margin-top: 18px; }
    .drawer-item[hidden] { display: none; }

    .theme-state {
      color: var(--mobile-muted);
      font-size: 12px;
      font-weight: 400;
    }

    @media (max-width: 390px) {
      body.app-shell > .mobile-page { padding-inline: 9px; }
      .services { gap: 8px; }
      .service-card { min-height: 124px; border-radius: 17px; padding-inline: 4px; }
      .service-icon { width: 60px; height: 60px; border-radius: 17px; }
      .service-icon svg { width: 37px; height: 37px; }
      .hero { min-height: 285px; }
    }

    @media (min-width: 521px) {
      body.app-shell > .mobile-page {
        border-inline: 1px solid rgba(148, 163, 184, .15);
        box-shadow: 0 0 45px rgba(15, 64, 109, .08);
      }
    }
  </style>

  <script>
    const token = sessionStorage.getItem('authToken');
    if (!token) {
      window.location.href = '/login.html';
    }

    function parseJwtPayload(value) {
      try {
        const payload = String(value || '').split('.')[1];
        if (!payload) return null;
        const normalized = payload.replace(/-/g, '+').replace(/_/g, '/');
        return JSON.parse(atob(normalized.padEnd(Math.ceil(normalized.length / 4) * 4, '=')));
      } catch {
        return null;
      }
    }

    const parsedUser = parseJwtPayload(token);
    const decodeUserText = window.MainProjectTextEncoding.decodeUtf8Mojibake;
    const currentUser = parsedUser
      ? {
          ...parsedUser,
          name: decodeUserText(parsedUser.name),
          username: decodeUserText(parsedUser.username)
        }
      : null;
    const currentRole = String(currentUser?.role || '').trim().toLowerCase();
    const allowedPages = new Set(Array.isArray(currentUser?.allowedPages) ? currentUser.allowedPages : []);
    const menuBtn = document.getElementById('menuBtn');
    const drawerOverlay = document.getElementById('drawerOverlay');
    const themeToggleBtn = document.getElementById('themeToggleBtn');
    const themeState = document.getElementById('themeState');
    const desktopModeBtn = document.getElementById('desktopModeBtn');
    const desktopModeState = document.getElementById('desktopModeState');
    const profileAvatarImage = document.getElementById('profileAvatarImage');

    if (!currentUser) {
      sessionStorage.removeItem('authToken');
      window.location.href = '/login.html';
    }

    document.getElementById('profileName').textContent = currentUser?.name || currentUser?.username || 'المستخدم';
    document.getElementById('profileUsername').textContent = currentUser?.name && currentUser?.username
      ? currentUser.username
      : '';
    async function loadProfileImage() {
      try {
        const userKey = window.profileImageStore.getUserKey(currentUser);
        const image = await window.profileImageStore.get(userKey);
        if (!image) return;
        profileAvatarImage.src = URL.createObjectURL(image);
      } catch (error) {
        console.error(error);
      }
    }

    if (currentRole !== 'admin') {
      document.querySelectorAll('[data-page-key]').forEach((link) => {
        link.hidden = !allowedPages.has(String(link.dataset.pageKey || ''));
      });
      document.querySelectorAll('.admin-only').forEach((element) => {
        element.hidden = true;
      });
    } else {
      desktopModeBtn.hidden = false;
    }

    function setDrawerOpen(isOpen) {
      drawerOverlay.classList.toggle('open', isOpen);
      drawerOverlay.setAttribute('aria-hidden', String(!isOpen));
      menuBtn.setAttribute('aria-expanded', String(isOpen));
      document.body.style.overflow = isOpen ? 'hidden' : '';
    }

    menuBtn.addEventListener('click', () => setDrawerOpen(true));
    drawerOverlay.addEventListener('click', (event) => {
      if (event.target === drawerOverlay) setDrawerOpen(false);
    });
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') setDrawerOpen(false);
    });

    function applyTheme(theme) {
      const isDark = theme === 'dark';
      document.body.classList.toggle('dark-mode', isDark);
      themeState.textContent = isDark ? 'مفعل' : 'متوقف';
      document.querySelector('meta[name="theme-color"]').content = isDark ? '#071525' : '#f6faff';
    }

    const savedTheme = localStorage.getItem('mobileTheme') === 'dark' ? 'dark' : 'light';
    applyTheme(savedTheme);
    desktopModeState.textContent = sessionStorage.getItem('uiMode') === 'desktop' ? 'مفعل' : 'متوقف';
    loadProfileImage();
    themeToggleBtn.addEventListener('click', () => {
      const nextTheme = document.body.classList.contains('dark-mode') ? 'light' : 'dark';
      localStorage.setItem('mobileTheme', nextTheme);
      applyTheme(nextTheme);
    });
    desktopModeBtn.addEventListener('click', () => {
      sessionStorage.setItem('uiMode', 'desktop');
      desktopModeState.textContent = 'مفعل';
    });

    if (typeof window.initShortcutInstallGate === 'function') {
      window.initShortcutInstallGate({
        appName: 'إدارة البلاغات',
        logoSrc: '/images/logo.png'
      });
    }

    document.getElementById('logoutBtn').addEventListener('click', () => {
      const refreshToken = localStorage.getItem('refreshToken');
      if (refreshToken) {
        fetch('/api/auth/logout', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            Authorization: `Bearer ${token}`,
            'X-UI-Mode': 'mobile'
          },
          body: JSON.stringify({ refreshToken }),
          keepalive: true
        }).catch(() => {});
      }
      localStorage.removeItem('refreshToken');
      sessionStorage.removeItem('authToken');
      sessionStorage.removeItem('uiMode');
      window.location.href = '/login.html';
    });
  </script>
</body>
</html>
