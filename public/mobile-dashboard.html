<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>النسخة الموبايل</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#1d4ed8" />
  <meta name="apple-mobile-web-app-title" content="إدارة البلاغات" />
  <link rel="apple-touch-icon" href="/images/logo.png" />
  <style>
    :root {
      --bg: #07111f;
      --bg-2: #0f172a;
      --card: rgba(255, 255, 255, 0.08);
      --card-border: rgba(255, 255, 255, 0.12);
      --text: #eff6ff;
      --muted: #bfdbfe;
      --accent: #38bdf8;
      --accent-2: #2563eb;
      --danger: #fb7185;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Tahoma, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top right, rgba(56, 189, 248, 0.24), transparent 34%),
        radial-gradient(circle at top left, rgba(37, 99, 235, 0.22), transparent 28%),
        linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
    }

    .page {
      width: min(760px, calc(100vw - 20px));
      min-height: 100vh;
      margin: 0 auto;
      padding: 16px 0 24px;
      display: grid;
      gap: 14px;
      align-content: start;
    }

    .hero,
    .panel {
      border: 1px solid var(--card-border);
      border-radius: 22px;
      background: var(--card);
      box-shadow: 0 18px 50px rgba(2, 6, 23, 0.32);
      backdrop-filter: blur(18px);
    }

    .hero {
      padding: 16px;
      display: grid;
      gap: 8px;
    }

    .brand {
      display: grid;
      justify-items: center;
      gap: 8px;
      text-align: center;
    }

    .brand img {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      object-fit: cover;
      flex: 0 0 auto;
      border: 1px solid rgba(255, 255, 255, 0.18);
    }

    .brand strong {
      font-size: 18px;
      line-height: 1.25;
      letter-spacing: .01em;
    }

    .btn {
      border: 0;
      border-radius: 16px;
      padding: 12px 16px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      color: #fff;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      transition: transform .18s ease, background .18s ease;
    }

    .btn:hover { transform: translateY(-1px); }

    .btn.primary { background: linear-gradient(135deg, var(--accent), var(--accent-2)); }
    .btn.secondary { background: rgba(255, 255, 255, 0.12); border: 1px solid var(--card-border); }

    .panel {
      padding: 14px;
      display: grid;
      gap: 10px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .card {
      display: grid;
      place-items: center;
      gap: 0;
      min-height: 72px;
      padding: 12px 14px;
      border-radius: 18px;
      border: 1px solid var(--card-border);
      background: rgba(15, 23, 42, 0.28);
      color: var(--text);
      text-decoration: none;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
    }

    .card strong {
      font-size: 15px;
      line-height: 1.3;
      text-align: center;
    }

    .card .tag,
    .card span {
      display: none;
    }

    .footer {
      margin-top: 2px;
      padding: 0 14px;
      display: grid;
      gap: 10px;
    }

    .logout-btn {
      width: 100%;
      background: linear-gradient(135deg, #ef4444, #b91c1c);
      color: #fff;
      border: 0;
      border-radius: 18px;
      padding: 0;
      font: inherit;
      font-weight: 700;
      height: 72px;
      cursor: pointer;
      text-align: center;
      display: grid;
      place-items: center;
      transition: transform .18s ease, background .18s ease;
    }

    .logout-btn strong {
      font-size: 15px;
      line-height: 1.3;
    }

    .logout-btn:hover { transform: translateY(-1px); }

    @media (max-width: 640px) {
      .page { width: min(100vw, calc(100vw - 14px)); padding-top: 10px; }
      .grid { grid-template-columns: 1fr; }
      .hero h1 { font-size: 22px; }
      .footer { padding: 0 14px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="hero">
      <div class="brand">
        <img src="/images/logo.png" alt="شعار الإدارة" />
        <strong>إدارة البلاغات</strong>
      </div>
    </section>

    <section class="panel">
      <div class="grid">
        <a class="card" href="/employees.html">
          <strong>الموظفين</strong>
        </a>
        <a class="card" href="/daily.html">
          <strong>اليوميات</strong>
        </a>
        <a class="card" href="/statistics.html">
          <strong>الإحصائيات</strong>
        </a>
        <a class="card" href="/holidays.html">
          <strong>الإجازات</strong>
        </a>
        <a class="card" href="/transfers.html">
          <strong>التنقلات</strong>
        </a>
        <a class="card" href="/outgoing.html">
          <strong>الصادر</strong>
        </a>
        <a class="card" href="/incoming.html">
          <strong>الوارد</strong>
        </a>
        <a class="card" href="/outside-employees.html">
          <strong>خارج الإدارة</strong>
        </a>
      </div>
    </section>

    <section class="footer">
      <button class="logout-btn" id="logoutBtn" type="button"><strong>تسجيل الخروج</strong></button>
    </section>
  </main>

  <script src="/install-shortcut.js"></script>
  <script>
    const token = localStorage.getItem('authToken');
    if (!token) {
      window.location.href = '/login.html';
    }

    if (typeof window.initShortcutInstallGate === 'function') {
      window.initShortcutInstallGate({
        appName: 'إدارة البلاغات',
        logoSrc: '/images/logo.png'
      });
    }

    document.getElementById('logoutBtn').addEventListener('click', () => {
      localStorage.removeItem('authToken');
      localStorage.removeItem('uiMode');
      window.location.href = '/login.html';
    });
  </script>
</body>
</html>
