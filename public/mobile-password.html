<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>تعديل كلمة السر</title>
  <link rel="stylesheet" href="/layout-defaults.css" />
  <meta name="theme-color" content="#f6faff" />
  <style>
    :root {
      --page-bg: #f6faff;
      --surface: rgba(255, 255, 255, .94);
      --text: #0b2447;
      --muted: #64748b;
      --primary: #0875cf;
      --primary-dark: #055ba5;
      --border: #d7e5f3;
      --danger: #b91c1c;
      --success: #166534;
      --shadow: 0 18px 45px rgba(30, 93, 151, .14);
    }

    * { box-sizing: border-box; }

    body.app-shell {
      color: var(--text);
      background:
        radial-gradient(ellipse at 5% 10%, rgba(147, 197, 253, .24), transparent 32%),
        radial-gradient(ellipse at 95% 26%, rgba(191, 219, 254, .28), transparent 32%),
        linear-gradient(180deg, #fbfdff 0%, var(--page-bg) 100%);
    }

    body.app-shell > .password-page {
      width: min(520px, 100vw);
      min-height: 100vh;
      padding: calc(24px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
      display: grid;
      grid-template-rows: auto 1fr;
      align-content: start;
      gap: 26px;
    }

    .page-header {
      display: grid;
      grid-template-columns: 46px 1fr 46px;
      align-items: center;
      gap: 10px;
    }

    .back-button {
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 14px;
      color: var(--primary);
      background: rgba(255, 255, 255, .88);
      box-shadow: 0 6px 18px rgba(30, 93, 151, .1);
      cursor: pointer;
    }

    .back-button svg { width: 25px; height: 25px; stroke: currentColor; }
    .page-header h1 { margin: 0; font-size: 21px; text-align: center; }

    .password-card {
      align-self: start;
      margin-top: min(15vh, 110px);
      padding: 26px 20px;
      display: grid;
      gap: 20px;
      border: 1px solid rgba(8, 117, 207, .1);
      border-radius: 24px;
      background: var(--surface);
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
    }

    .card-heading {
      display: grid;
      justify-items: center;
      gap: 10px;
      text-align: center;
    }

    .lock-icon {
      width: 70px;
      height: 70px;
      display: grid;
      place-items: center;
      border-radius: 22px;
      color: var(--primary);
      background: linear-gradient(145deg, #f8fbff, #e4f1fd);
    }

    .lock-icon svg { width: 38px; height: 38px; stroke: currentColor; }
    .card-heading h2 { margin: 0; font-size: 20px; }
    .card-heading p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.6; }

    .password-form { display: grid; gap: 16px; }
    .password-field { display: grid; gap: 7px; }
    .password-field label { color: var(--text); font-size: 14px; font-weight: 700; }

    .password-control { position: relative; }
    body.app-shell .password-control input {
      min-height: 52px;
      padding: 12px 14px 12px 52px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: #fff;
      font-size: 16px;
    }

    .password-toggle {
      position: absolute;
      top: 50%;
      left: 8px;
      width: 40px;
      height: 40px;
      padding: 8px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 10px;
      color: #5c7188;
      background: transparent;
      transform: translateY(-50%);
      cursor: pointer;
    }

    .password-toggle svg { width: 23px; height: 23px; stroke: currentColor; }

    .save-button {
      min-height: 52px;
      margin-top: 4px;
      border: 0;
      border-radius: 15px;
      color: #fff;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      box-shadow: 0 9px 20px rgba(8, 117, 207, .23);
      font: inherit;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .save-button:disabled { opacity: .65; cursor: wait; }

    .status-message {
      display: none;
      padding: 11px 13px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      text-align: center;
    }

    .status-message.show { display: block; }
    .status-message.error { color: var(--danger); background: #fee2e2; }
    .status-message.success { color: var(--success); background: #dcfce7; }
  </style>
</head>
<body class="app-shell">
  <main class="password-page">
    <header class="page-header">
      <button class="back-button" id="backBtn" type="button" aria-label="العودة إلى الرئيسية">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m9 18 6-6-6-6"></path>
        </svg>
      </button>
      <h1>تعديل كلمة السر</h1>
      <span aria-hidden="true"></span>
    </header>

    <section class="password-card">
      <div class="card-heading">
        <span class="lock-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="10" width="16" height="11" rx="2"></rect>
            <path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"></path>
          </svg>
        </span>
        <h2>كلمة سر جديدة</h2>
        <p>أدخل كلمة السر الجديدة ثم أعد كتابتها للتأكيد.</p>
      </div>

      <form class="password-form" id="passwordForm" autocomplete="off">
        <div class="password-field">
          <label for="newPassword">كلمة السر الجديدة</label>
          <div class="password-control">
            <input id="newPassword" name="newPassword" type="password" required autocomplete="new-password" />
            <button class="password-toggle" type="button" data-password-target="newPassword" aria-label="إظهار كلمة السر" aria-pressed="false">
              <svg viewBox="0 0 24 24" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"></path>
                <circle cx="12" cy="12" r="2.5"></circle>
              </svg>
            </button>
          </div>
        </div>

        <div class="password-field">
          <label for="confirmPassword">تأكيد كلمة السر</label>
          <div class="password-control">
            <input id="confirmPassword" name="confirmPassword" type="password" required autocomplete="new-password" />
            <button class="password-toggle" type="button" data-password-target="confirmPassword" aria-label="إظهار كلمة السر" aria-pressed="false">
              <svg viewBox="0 0 24 24" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"></path>
                <circle cx="12" cy="12" r="2.5"></circle>
              </svg>
            </button>
          </div>
        </div>

        <div class="status-message" id="statusMessage" role="status"></div>
        <button class="save-button" id="saveBtn" type="submit">حفظ</button>
      </form>
    </section>
  </main>

  <script>
    const authToken = sessionStorage.getItem('authToken');
    if (!authToken) {
      window.location.href = '/login.html';
    }

    const passwordForm = document.getElementById('passwordForm');
    const newPasswordInput = document.getElementById('newPassword');
    const confirmPasswordInput = document.getElementById('confirmPassword');
    const statusMessage = document.getElementById('statusMessage');
    const saveBtn = document.getElementById('saveBtn');

    function setStatus(message, type = '') {
      statusMessage.textContent = message || '';
      statusMessage.className = 'status-message';
      if (!message) return;
      statusMessage.classList.add('show', type === 'success' ? 'success' : 'error');
    }

    document.querySelectorAll('[data-password-target]').forEach((button) => {
      button.addEventListener('click', () => {
        const input = document.getElementById(button.dataset.passwordTarget);
        const shouldShow = input.type === 'password';
        input.type = shouldShow ? 'text' : 'password';
        button.setAttribute('aria-pressed', String(shouldShow));
        button.setAttribute('aria-label', shouldShow ? 'إخفاء كلمة السر' : 'إظهار كلمة السر');
      });
    });

    passwordForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      const newPassword = newPasswordInput.value;
      const confirmPassword = confirmPasswordInput.value;
      if (!newPassword) {
        setStatus('يرجى إدخال كلمة السر الجديدة.', 'error');
        return;
      }
      if (newPassword !== confirmPassword) {
        setStatus('كلمتا السر غير متطابقتين.', 'error');
        return;
      }

      saveBtn.disabled = true;
      setStatus('');
      try {
        const response = await fetch('/api/auth/change-password', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            Authorization: `Bearer ${authToken}`,
            'X-UI-Mode': 'mobile'
          },
          body: JSON.stringify({ newPassword, confirmPassword })
        });
        if (response.status === 401) {
          sessionStorage.removeItem('authToken');
          window.location.href = '/login.html';
          return;
        }

        const payload = await response.json().catch(() => ({}));
        if (!response.ok) {
          setStatus(payload.message || 'تعذر حفظ كلمة السر الجديدة.', 'error');
          return;
        }

        localStorage.removeItem('refreshToken');
        localStorage.removeItem('loginPassword');
        passwordForm.reset();
        setStatus(payload.message || 'تم حفظ كلمة السر الجديدة بنجاح.', 'success');
      } catch (error) {
        setStatus(error.message || 'تعذر الاتصال بالخادم.', 'error');
      } finally {
        saveBtn.disabled = false;
      }
    });

    document.getElementById('backBtn').addEventListener('click', () => {
      window.location.href = '/mobile-dashboard.html';
    });
  </script>
</body>
</html>
