<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>طباعة ملف الأرشيف</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #fff; font-family: Tahoma, Arial, sans-serif; }
    .print-toolbar { position: sticky; top: 0; z-index: 2; display: flex; justify-content: center; gap: 8px; padding: 10px; background: #f8fafc; border-bottom: 1px solid #cbd5e1; }
    .print-toolbar button { border: 0; border-radius: 8px; padding: 10px 18px; background: #1d4ed8; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
    .print-toolbar .close-btn { background: #475569; }
    #printFrame { display: block; width: 100%; height: calc(100vh - 61px); border: 0; background: #fff; }
    .status { padding: 24px; text-align: center; color: #991b1b; font-weight: 700; }
    @media print {
      .print-toolbar { display: none !important; }
      #printFrame { height: 100vh; }
    }
  </style>
</head>
<body>
  <div class="print-toolbar">
    <button id="printBtn" type="button">طباعة</button>
    <button class="close-btn" id="closeBtn" type="button">إغلاق</button>
  </div>
  <iframe id="printFrame" title="معاينة الملف للطباعة"></iframe>
  <div class="status" id="status" hidden></div>

  <script>
    const authToken = localStorage.getItem('authToken');
    const params = new URLSearchParams(window.location.search);
    const category = params.get('category') || '';
    const recordId = Number(params.get('id') || 0);
    const autoPrint = params.get('autoprint') !== '0';
    const printFrame = document.getElementById('printFrame');
    const status = document.getElementById('status');
    let contentReady = false;

    function showError(message) {
      status.textContent = message;
      status.hidden = false;
      printFrame.hidden = true;
    }

    function invokeNativePrint() {
      if (!contentReady) return;
      try {
        printFrame.contentWindow.focus();
        printFrame.contentWindow.print();
      } catch {
        window.print();
      }
    }

    async function loadFile() {
      if (!authToken || !category || !recordId) {
        showError('تعذر التحقق من الملف أو جلسة الدخول.');
        return;
      }

      const response = await fetch(`/api/archive/preview/${encodeURIComponent(category)}/${encodeURIComponent(recordId)}`, {
        headers: { Authorization: `Bearer ${authToken}` }
      });
      if (response.status === 401 || response.status === 403) {
        localStorage.removeItem('authToken');
        window.location.href = '/';
        return;
      }
      if (!response.ok) {
        showError('تعذر تجهيز الملف للطباعة.');
        return;
      }

      const blob = await response.blob();
      printFrame.addEventListener('load', () => {
        contentReady = true;
        if (autoPrint) setTimeout(invokeNativePrint, 250);
      }, { once: true });
      printFrame.src = URL.createObjectURL(blob);
    }

    document.getElementById('printBtn').addEventListener('click', invokeNativePrint);
    document.getElementById('closeBtn').addEventListener('click', () => window.close());
    loadFile().catch((error) => showError(error.message || 'تعذر تجهيز الملف للطباعة.'));
  </script>
</body>
</html>
