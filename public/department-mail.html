<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>بريد الأقسام والنوبات</title>
  <link rel="stylesheet" href="/layout-defaults.css" />
  <link rel="stylesheet" href="/email-attachments.css" />
  <script src="/app-theme.js"></script>
  <script src="/role-access.js" defer></script>
  <style>
    body.app-shell { background: linear-gradient(180deg, #dfeaff 0%, #f8fbff 100%); }
    .field.full { grid-column: 1 / -1; }
    .admin-only-field { display: none !important; }
    .admin-only-field.admin-visible { display: grid !important; }
    .user-name-column { display: none !important; }
    body.app-shell .date-range-tools {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      max-width: 720px;
      margin-bottom: 12px;
    }
    body.app-shell .department-mail-filters {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      flex: 0 1 720px;
      min-width: 0;
      width: 100%;
      max-width: 720px;
    }
    body.app-shell .department-mail-form-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    body.app-shell .table-tools-search-refresh .department-mail-search-tools {
      justify-content: space-between;
      align-items: flex-end;
    }
    .doc-images-box {
      margin-top: 16px;
      padding: 14px;
      border: 1px solid var(--ui-border);
      border-radius: 14px;
      background: #f8fafc;
    }
    .doc-images-head,
    .doc-images-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      font-weight: 700;
    }
    .doc-images-view {
      margin: 12px 0;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
    }
    .doc-images-frame {
      min-height: 220px;
      display: grid;
      place-items: center;
      overflow: hidden;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      background: #fff;
    }
    .doc-images-frame img {
      display: none;
      width: auto;
      max-width: 100%;
      max-height: 65vh;
      object-fit: contain;
    }
    .doc-images-nav {
      width: 38px;
      height: 38px;
      border: 0;
      border-radius: 10px;
      background: #1d4ed8;
      color: #fff;
      cursor: pointer;
    }
    .doc-images-nav:disabled { opacity: .45; cursor: default; }
    table { min-width: 1050px; }
    @media (max-width: 680px) {
      .doc-images-view { grid-template-columns: 34px minmax(0, 1fr) 34px; }
      .doc-images-frame { min-height: 170px; }
      table { min-width: 900px; }
    }
    @media (max-width: 680px) {
      body.app-shell .date-range-tools { grid-template-columns: minmax(0, 1fr); }
      body.app-shell .department-mail-filters { grid-template-columns: minmax(0, 1fr); }
    }
  </style>
</head>
<body class="app-shell">
  <main class="page app-page">
    <header class="header">
      <div>
        <h1>بريد الأقسام والنوبات</h1>
        <p>إدارة البريد الداخلي الموجّه إلى الأقسام والنوبات.</p>
      </div>
      <div class="actions">
        <button type="button" class="btn dark home-nav-button" id="backBtn">العودة للرئيسية</button>
      </div>
    </header>

    <section class="panel">
      <h2>تعبئة / إظهار البيانات</h2>
      <form id="departmentMailForm" autocomplete="off">
        <input id="recordId" type="hidden" />
        <div class="grid department-mail-form-grid">
          <div class="field">
            <label for="mailDate">التاريخ</label>
            <div class="date-picker-wrap">
              <input id="mailDateDisplay" class="date-display-input" type="text" placeholder="yyyy/mm/dd" readonly />
              <button type="button" class="date-picker-trigger" data-picker-id="mailDate" aria-label="اختيار التاريخ"></button>
              <input id="mailDate" class="native-date-input" type="date" />
            </div>
          </div>
          <div class="field">
            <label for="mailWeekday">اليوم</label>
            <input id="mailWeekday" type="text" readonly />
          </div>
          <div class="field">
            <label for="department" class="required">القسم</label>
            <select id="department" required><option value="">-- اختر --</option></select>
          </div>
          <div class="field">
            <label for="section" class="required">النوبة</label>
            <select id="section" required><option value="">-- اختر --</option></select>
          </div>
          <div class="field full admin-only-field" id="userNameField">
            <label for="userName">اسم المستخدم</label>
            <input id="userName" type="text" readonly />
          </div>
          <div class="field full">
            <label for="notes">ملاحظات</label>
            <textarea id="notes"></textarea>
          </div>
        </div>
        <div class="toolbar">
          <button type="submit" class="btn success" id="addBtn">إضافة بيانات</button>
          <button type="button" class="btn warning" id="updateBtn">تعديل بيانات</button>
          <button type="button" class="btn danger" id="deleteBtn">حذف بيانات</button>
          <button type="button" class="btn primary" id="printBtn">طباعة بيانات</button>
        </div>
      </form>
      <div id="statusLine" class="status-line"></div>

      <div class="doc-images-box"></div>
    </section>

    <section class="panel">
      <h2>صندوق عرض البيانات</h2>
      <div class="table-tools table-tools-search-refresh">
        <p id="countLabel">عدد السجلات: 0</p>
        <div class="table-search-tools department-mail-search-tools">
          <div class="department-mail-filters">
            <div class="field">
              <label for="filterDepartment">القسم</label>
              <select id="filterDepartment"><option value="">-- اختر --</option></select>
            </div>
            <div class="field">
              <label for="filterSection">النوبة</label>
              <select id="filterSection"><option value="">-- اختر --</option></select>
            </div>
          </div>
          <button type="button" class="btn primary" id="refreshBtn">تحديث العرض</button>
        </div>
      </div>
      <div class="date-range-tools">
        <div class="field">
          <label for="filterFromDate">من التاريخ</label>
          <div class="date-picker-wrap">
            <input id="filterFromDateDisplay" class="date-display-input" type="text" placeholder="yyyy/mm/dd" readonly />
            <button type="button" class="date-picker-trigger" data-picker-id="filterFromDate" aria-label="اختيار من التاريخ"></button>
            <input id="filterFromDate" class="native-date-input" type="date" />
          </div>
        </div>
        <div class="field">
          <label for="filterToDate">إلى التاريخ</label>
          <div class="date-picker-wrap">
            <input id="filterToDateDisplay" class="date-display-input" type="text" placeholder="yyyy/mm/dd" readonly />
            <button type="button" class="date-picker-trigger" data-picker-id="filterToDate" aria-label="اختيار إلى التاريخ"></button>
            <input id="filterToDate" class="native-date-input" type="date" />
          </div>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th class="sortable-id-header" aria-sort="none" style="cursor: pointer;">م</th>
              <th>التاريخ</th>
              <th>القسم</th>
              <th>النوبة</th>
              <th>ملاحظات</th>
              <th class="user-name-column">اسم المستخدم</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="/daily-scanner.js"></script>
  <script src="/email-scanner.js"></script>
  <script>
    const authToken = sessionStorage.getItem('authToken');
    if (!authToken) window.location.href = '/';

    function parseJwtPayload(token) {
      try {
        const payload = String(token || '').split('.')[1];
        if (!payload) return null;
        const normalized = payload.replace(/-/g, '+').replace(/_/g, '/');
        return JSON.parse(atob(normalized.padEnd(Math.ceil(normalized.length / 4) * 4, '=')));
      } catch {
        return null;
      }
    }

    const currentUser = parseJwtPayload(authToken);
    if (!currentUser) {
      sessionStorage.removeItem('authToken');
      window.location.href = '/';
    }

    const form = document.getElementById('departmentMailForm');
    const recordIdInput = document.getElementById('recordId');
    const mailDateDisplayInput = document.getElementById('mailDateDisplay');
    const mailDateInput = document.getElementById('mailDate');
    const mailWeekdayInput = document.getElementById('mailWeekday');
    const departmentInput = document.getElementById('department');
    const sectionInput = document.getElementById('section');
    const notesInput = document.getElementById('notes');
    const userNameInput = document.getElementById('userName');
    const userNameField = document.getElementById('userNameField');
    const rowsBody = document.getElementById('rows');
    const countLabel = document.getElementById('countLabel');
    const filterDepartmentInput = document.getElementById('filterDepartment');
    const filterSectionInput = document.getElementById('filterSection');
    const filterFromDateInput = document.getElementById('filterFromDate');
    const filterToDateInput = document.getElementById('filterToDate');
    const filterFromDateDisplayInput = document.getElementById('filterFromDateDisplay');
    const filterToDateDisplayInput = document.getElementById('filterToDateDisplay');
    const statusLine = document.getElementById('statusLine');
    const addBtn = document.getElementById('addBtn');
    const updateBtn = document.getElementById('updateBtn');
    const deleteBtn = document.getElementById('deleteBtn');
    const userNameColumnCells = () => document.querySelectorAll('.user-name-column');
    const apiBase = '/api/department-mail';

    let allRecords = [];
    let departmentSections = [];
    let selectedRowId = null;
    let idSortDirection = null;
    const currentRole = String(currentUser?.role || '').trim().toLowerCase();
    const editablePages = Array.isArray(currentUser?.editablePages) ? currentUser.editablePages : currentUser?.allowedPages;
    const emailScanner = initEmailScanner({
      authToken,
      moduleKey: 'departmentmail',
      getRecordId: () => selectedRowId,
      getApiBase: (record) => `/api/department-mail-scans/${encodeURIComponent(String(record.id))}`,
      canEdit: currentRole === 'admin'
        || (currentRole !== 'view' && Array.isArray(editablePages) && editablePages.includes('departmentMail')),
      onStatus: showStatus
    });

    function isAdminUser() {
      return String(currentUser?.role || '').trim().toLowerCase() === 'admin';
    }

    function showStatus(message, isError = false) {
      statusLine.className = `status-line show ${isError ? 'error' : 'ok'}`;
      statusLine.textContent = message;
    }

    function clearStatus() {
      statusLine.className = 'status-line';
      statusLine.textContent = '';
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function pad2(value) {
      return String(value).padStart(2, '0');
    }

    function parseDate(value) {
      const match = String(value || '').trim().replace(/-/g, '/').match(/^(\d{4})\/(\d{1,2})\/(\d{1,2})$/);
      return match ? new Date(Number(match[1]), Number(match[2]) - 1, Number(match[3])) : null;
    }

    function formatDate(value) {
      const date = parseDate(value);
      if (!date || Number.isNaN(date.getTime())) return '';
      return `${date.getFullYear()}/${pad2(date.getMonth() + 1)}/${pad2(date.getDate())}`;
    }

    function toDateInput(value) {
      return formatDate(value).replace(/\//g, '-');
    }

    function setTodayDate() {
      const today = new Date();
      mailDateInput.value = `${today.getFullYear()}-${pad2(today.getMonth() + 1)}-${pad2(today.getDate())}`;
      syncDateDisplay();
    }

    function syncDateDisplay() {
      mailDateDisplayInput.value = formatDate(mailDateInput.value);
      const selectedDate = mailDateInput.value
        ? new Date(`${mailDateInput.value}T00:00:00`)
        : null;
      mailWeekdayInput.value = selectedDate && !Number.isNaN(selectedDate.getTime())
        ? new Intl.DateTimeFormat('ar', { weekday: 'long' }).format(selectedDate)
        : '';
    }

    function syncFilterDateDisplays() {
      filterFromDateDisplayInput.value = formatDate(filterFromDateInput.value);
      filterToDateDisplayInput.value = formatDate(filterToDateInput.value);
    }

    function getHeaders() {
      return {
        'Content-Type': 'application/json',
        Authorization: `Bearer ${authToken}`
      };
    }

    async function requestJson(url, options = {}) {
      const response = await fetch(url, options);
      if (response.status === 401) {
        sessionStorage.removeItem('authToken');
        window.location.href = '/';
        return null;
      }
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(String(data.message || '').trim() || 'تعذر إكمال العملية.');
      return data;
    }

    function populateSelect(select, values, preferredValue = '', emptyLabel = '-- اختر --') {
      const uniqueValues = [...new Set(values.map((value) => String(value || '').trim()).filter(Boolean))];
      if (preferredValue && !uniqueValues.includes(preferredValue)) uniqueValues.push(preferredValue);
      select.innerHTML = '';
      const emptyOption = document.createElement('option');
      emptyOption.value = '';
      emptyOption.textContent = emptyLabel;
      select.appendChild(emptyOption);
      uniqueValues.forEach((value) => {
        const option = document.createElement('option');
        option.value = value;
        option.textContent = value;
        select.appendChild(option);
      });
      select.value = uniqueValues.includes(preferredValue) ? preferredValue : '';
    }

    function populateDepartments(preferredValue = '') {
      populateSelect(departmentInput, departmentSections.map((item) => item.Department), preferredValue);
    }

    function populateSections(preferredValue = '') {
      const department = String(departmentInput.value || '').trim();
      populateSelect(
        sectionInput,
        departmentSections
          .filter((item) => String(item.Department || '').trim() === department)
          .map((item) => item.Section),
        preferredValue
      );
    }

    function populateFilterDepartments(preferredValue = '') {
      populateSelect(
        filterDepartmentInput,
        departmentSections.map((item) => item.Department),
        preferredValue,
        '-- اختر --'
      );
    }

    function populateFilterSections(preferredValue = '') {
      const department = String(filterDepartmentInput.value || '').trim();
      populateSelect(
        filterSectionInput,
        departmentSections
          .filter((item) => !department || String(item.Department || '').trim() === department)
          .map((item) => item.Section),
        preferredValue,
        '-- اختر --'
      );
    }

    async function loadDepartmentSections() {
      const data = await requestJson('/api/employees/department-sections', {
        headers: { Authorization: `Bearer ${authToken}` }
      });
      departmentSections = Array.isArray(data) ? data : [];
      const currentDepartment = departmentInput.value;
      const currentSection = sectionInput.value;
      const currentFilterDepartment = filterDepartmentInput.value;
      const currentFilterSection = filterSectionInput.value;
      populateDepartments(currentDepartment);
      populateSections(currentSection);
      populateFilterDepartments(currentFilterDepartment);
      populateFilterSections(currentFilterSection);
    }

    function syncAdminFields() {
      userNameInput.value = String(currentUser?.username || 'system');
      if (userNameField) userNameField.classList.toggle('admin-visible', isAdminUser());
      userNameColumnCells().forEach((cell) => {
        cell.style.display = isAdminUser() ? 'table-cell' : 'none';
      });
    }

    function clearForm() {
      form.reset();
      recordIdInput.value = '';
      selectedRowId = null;
      setTodayDate();
      populateDepartments();
      populateSections();
      syncAdminFields();
      emailScanner.clear();
      rowsBody.querySelectorAll('tr').forEach((row) => row.classList.remove('selected'));
    }

    function loadRecord(record) {
      selectedRowId = Number(record.ID || 0) || null;
      recordIdInput.value = selectedRowId || '';
      mailDateInput.value = toDateInput(record.MailDate);
      populateDepartments(record.Department || '');
      populateSections(record.Section || '');
      notesInput.value = record.Notes || '';
      userNameInput.value = record.UserName || currentUser?.username || '';
      syncDateDisplay();
      rowsBody.querySelectorAll('tr').forEach((row) => {
        row.classList.toggle('selected', Number(row.dataset.id || 0) === selectedRowId);
      });
      emailScanner.load();
    }

    function getVisibleRecords() {
      const department = String(filterDepartmentInput.value || '').trim();
      const section = String(filterSectionInput.value || '').trim();
      const fromDate = filterFromDateInput.value;
      const toDate = filterToDateInput.value;
      return allRecords.filter((record) => {
        if (department && String(record.Department || '').trim() !== department) return false;
        if (section && String(record.Section || '').trim() !== section) return false;

        const recordDate = toDateInput(record.MailDate);
        if (fromDate && (!recordDate || recordDate < fromDate)) return false;
        if (toDate && (!recordDate || recordDate > toDate)) return false;
        return true;
      });
    }

    function renderRows() {
      const visibleRecords = getVisibleRecords();
      const records = idSortDirection
        ? [...visibleRecords].sort((left, right) => {
          const difference = (Number(left.ID) || 0) - (Number(right.ID) || 0);
          return idSortDirection === 'desc' ? -difference : difference;
        })
        : visibleRecords;
      countLabel.textContent = `عدد السجلات: ${records.length}`;
      if (!records.length) {
        rowsBody.innerHTML = `<tr><td colspan="${isAdminUser() ? 6 : 5}">لاتوجد بيانات حالياً.</td></tr>`;
        syncAdminFields();
        return;
      }

      rowsBody.innerHTML = records.map((record, index) => `
        <tr data-id="${Number(record.ID)}">
          <td class="mono">${index + 1}</td>
          <td class="mono">${escapeHtml(record.MailDate)}</td>
          <td>${escapeHtml(record.Department)}</td>
          <td>${escapeHtml(record.Section)}</td>
          <td>${escapeHtml(record.Notes)}</td>
          <td class="user-name-column">${escapeHtml(record.UserName)}</td>
        </tr>
      `).join('');

      rowsBody.querySelectorAll('tr[data-id]').forEach((row) => {
        row.addEventListener('click', () => {
          const record = allRecords.find((item) => Number(item.ID) === Number(row.dataset.id));
          if (record) loadRecord(record);
        });
      });
      syncAdminFields();
    }

    document.querySelector('.sortable-id-header').addEventListener('click', (event) => {
      idSortDirection = idSortDirection === 'asc' ? 'desc' : 'asc';
      const header = event.currentTarget;
      header.textContent = `م ${idSortDirection === 'asc' ? '↑' : '↓'}`;
      header.setAttribute('aria-sort', idSortDirection === 'asc' ? 'ascending' : 'descending');
      renderRows();
    });

    async function loadRecords() {
      const data = await requestJson(apiBase, {
        headers: { Authorization: `Bearer ${authToken}` }
      });
      allRecords = Array.isArray(data) ? data : [];
      renderRows();
    }

    function collectPayload() {
      return {
        MailDate: formatDate(mailDateInput.value),
        Department: String(departmentInput.value || '').trim(),
        Section: String(sectionInput.value || '').trim(),
        Notes: String(notesInput.value || '').trim(),
        UserName: String(userNameInput.value || currentUser?.username || 'system').trim()
      };
    }

    function validatePayload(payload) {
      const missing = [];
      if (!payload.Department) missing.push('القسم');
      if (!payload.Section) missing.push('النوبة');
      if (!missing.length) return true;
      showStatus(`الحقول الإلزامية ناقصة: ${missing.join(' - ')}`, true);
      return false;
    }

    function printCurrentRecord() {
      const payload = collectPayload();
      if (!validatePayload(payload)) return;
      const popup = window.open('', '_blank', 'width=900,height=700');
      if (!popup) {
        showStatus('تعذر فتح نافذة الطباعة. اسمح بالنوافذ المنبثقة ثم حاول مرة أخرى.', true);
        return;
      }
      const fields = [
        ['تاريخ البريد', payload.MailDate],
        ['القسم', payload.Department],
        ['النوبة', payload.Section],
        ['ملاحظات', payload.Notes || '--']
      ];
      popup.document.write(`<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>بريد الأقسام</title><style>body{font-family:Tahoma,Arial;padding:30px;color:#0f172a}h1{text-align:center}.card{border:1px solid #94a3b8;border-radius:12px;overflow:hidden}.row{display:grid;grid-template-columns:180px 1fr;border-bottom:1px solid #cbd5e1}.row:last-child{border-bottom:0}.label{padding:12px;font-weight:700;background:#eff6ff}.value{padding:12px}.mono{direction:ltr;unicode-bidi:isolate;text-align:right}</style></head><body><h1>بريد الأقسام والنوبات</h1><div class="card">${fields.map(([label, value]) => `<div class="row"><div class="label">${escapeHtml(label)}</div><div class="value">${escapeHtml(value)}</div></div>`).join('')}</div><script>window.onload=()=>window.print();<\/script></body></html>`);
      popup.document.close();
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      clearStatus();
      const payload = collectPayload();
      if (!validatePayload(payload)) return;
      addBtn.disabled = true;
      try {
        await requestJson(apiBase, {
          method: 'POST',
          headers: getHeaders(),
          body: JSON.stringify(payload)
        });
        showStatus('تمت إضافة بريد القسم بنجاح.');
        clearForm();
        await loadRecords();
      } catch (error) {
        showStatus(error.message, true);
      } finally {
        addBtn.disabled = false;
      }
    });

    updateBtn.addEventListener('click', async () => {
      clearStatus();
      if (!selectedRowId) {
        showStatus('اختر سجلًا من الجدول أولًا.', true);
        return;
      }
      const payload = collectPayload();
      if (!validatePayload(payload)) return;
      updateBtn.disabled = true;
      try {
        await requestJson(`${apiBase}/${selectedRowId}`, {
          method: 'PUT',
          headers: getHeaders(),
          body: JSON.stringify(payload)
        });
        showStatus('تم تعديل بريد القسم بنجاح.');
        await loadRecords();
      } catch (error) {
        showStatus(error.message, true);
      } finally {
        updateBtn.disabled = false;
      }
    });

    deleteBtn.addEventListener('click', async () => {
      clearStatus();
      if (!selectedRowId) {
        showStatus('اختر سجلًا من الجدول أولًا.', true);
        return;
      }
      if (!confirm('هل أنت متأكد من حذف سجل بريد القسم؟')) return;
      deleteBtn.disabled = true;
      try {
        await requestJson(`${apiBase}/${selectedRowId}`, {
          method: 'DELETE',
          headers: getHeaders(),
          body: JSON.stringify({ userName: currentUser?.username || 'system' })
        });
        showStatus('تم حذف بريد القسم بنجاح.');
        clearForm();
        await loadRecords();
      } catch (error) {
        showStatus(error.message, true);
      } finally {
        deleteBtn.disabled = false;
      }
    });

    departmentInput.addEventListener('change', () => populateSections());
    mailDateInput.addEventListener('change', syncDateDisplay);
    filterDepartmentInput.addEventListener('change', () => {
      populateFilterSections();
      renderRows();
    });
    filterSectionInput.addEventListener('change', renderRows);
    [filterFromDateInput, filterToDateInput].forEach((input) => {
      input.addEventListener('change', () => {
        syncFilterDateDisplays();
        renderRows();
      });
    });
    document.querySelectorAll('.date-picker-trigger').forEach((button) => {
      const pickerInput = document.getElementById(button.dataset.pickerId);
      if (pickerInput) {
        button.addEventListener('click', () => pickerInput.showPicker?.() || pickerInput.focus());
      }
    });
    document.getElementById('printBtn').addEventListener('click', printCurrentRecord);
    document.getElementById('refreshBtn').addEventListener('click', async () => {
      clearStatus();
      await loadDepartmentSections();
      await loadRecords();
      showStatus('تم تحديث عرض بريد الأقسام.');
    });
    document.getElementById('backBtn').addEventListener('click', () => {
      window.location.href = sessionStorage.getItem('uiMode') === 'mobile'
        ? '/mobile-dashboard.html'
        : '/dashboard.html';
    });

    (async () => {
      try {
        syncAdminFields();
        setTodayDate();
        await loadDepartmentSections();
        await loadRecords();
      } catch (error) {
        showStatus(error.message, true);
      }
    })();
  </script>
</body>
</html>
