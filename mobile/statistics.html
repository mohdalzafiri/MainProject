<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>الاحصائيات</title>
  <link rel="stylesheet" href="/layout-defaults.css" />
  <script src="/app-theme.js"></script>
  <link rel="stylesheet" href="/statistics-page.css" />
  <script src="/role-access.js" defer></script>
</head>
<body class="app-shell">
  <div class="page app-page">
    <section class="header">
      <div>
        <h1>واجهة الاحصائيات</h1>
        <p>اعرض أعداد الموظفين حسب الرتبة أو مقر العمل أو القسم أو النوبة.</p>
      </div>
      <div class="actions">
        <button type="button" class="btn dark home-nav-button" id="backBtn">العودة للرئيسية</button>
      </div>
    </section>

    <nav class="statistics-shortcuts" aria-label="واجهات مرتبطة">
      <button type="button" class="btn primary" data-page-key="employees" data-page-route="/employees.html" data-mobile-route="/mobile/employees.html" data-page-title="الموظفين">الموظفين</button>
      <button type="button" class="btn primary" data-page-key="holidays" data-page-route="/holidays.html" data-mobile-route="/mobile/holidays.html" data-page-title="الإجازات">الإجازات</button>
      <button type="button" class="btn primary" data-page-key="courses" data-page-route="/courses.html" data-mobile-route="/courses.html" data-page-title="الدورات">الدورات</button>
      <button type="button" class="btn primary" data-page-key="transfers" data-page-route="/transfers.html" data-mobile-route="/mobile/transfers.html" data-page-title="التنقلات">التنقلات</button>
      <button type="button" class="btn primary" data-page-key="reduction" data-page-route="/reduction.html" data-mobile-route="/mobile/reduction.html" data-page-title="تخفيف العمل">تخفيف العمل</button>
      <button type="button" class="btn primary" data-page-key="outsideEmployees" data-page-route="/outside-employees.html" data-mobile-route="/mobile/outside-employees.html" data-page-title="خارج الإدارة">خارج الإدارة</button>
    </nav>

    <section class="panel">
      <div class="statistics-selector">
        <div class="field">
          <label for="statisticType">نوع الإحصائية</label>
          <select id="statisticType">
            <option value="">-- اختر --</option>
            <option value="rank">الرتبة</option>
            <option value="work">مقر العمل</option>
            <option value="department">القسم</option>
            <option value="section">النوبة</option>
          </select>
        </div>
      </div>
      <p id="cardsHint" class="statistics-cards-hint" hidden></p>
      <div id="sectionCards" class="statistics-cards" hidden></div>
      <div class="toolbar">
        <button type="button" class="btn primary" id="printBtn">طباعة بيانات</button>
      </div>
      <div id="statusLine" class="status-line" aria-live="polite"></div>
    </section>

    <section class="panel">
      <h2>صندوق عرض البيانات</h2>
      <div class="table-tools">
        <p id="countLabel">عدد السجلات: 0</p>
        <input id="tableFilterInput" class="table-search" type="search" placeholder="فلترة باسم الموظف / القسم / النوبة / مقر العمل / المسمى الوظيفي" />
        <button type="button" class="btn primary" id="refreshBtn">تحديث العرض</button>
      </div>

      <div class="table-wrap">
        <table class="employees-table">
          <thead>
            <tr>
              <th class="sortable-serial-header" data-sort-key="serial" aria-sort="none" style="cursor: pointer;">م</th>
              <th class="sortable-rank-header" data-sort-key="rank" style="cursor: pointer;">الرتبة</th>
              <th>اسم الموظف</th>
              <th>الرقم المدني</th>
              <th>المسمى الوظيفي</th>
              <th>القسم</th>
              <th>النوبة</th>
              <th>مقر العمل</th>
              <th>تاريخ التعيين</th>
              <th>تاريخ المباشرة</th>
              <th>حالة الملف</th>
              <th>ملاحظات</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>
  </div>

  <dialog id="statisticsPageDialog" class="statistics-page-dialog" aria-labelledby="statisticsPageDialogTitle">
    <div class="statistics-page-dialog-header">
      <h2 id="statisticsPageDialogTitle" class="statistics-page-dialog-title">الواجهة</h2>
      <button type="button" class="btn dark" id="statisticsPageDialogCloseBtn">إغلاق</button>
    </div>
    <iframe id="statisticsPageFrame" class="statistics-page-frame" title="واجهة مرتبطة"></iframe>
  </dialog>

  <script src="/statistics-page.js"></script>
</body>
</html>
